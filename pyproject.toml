[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-forge"
version = "0.2.0"
description = "Fast, portable image, text, video, and live-media glyph rendering"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lloyd Handyside", email = "ace1928@gmail.com" }]
maintainers = [
    { name = "Lloyd Handyside", email = "lloyd.handyside@neuroforge.io" },
    { name = "Eidos", email = "syntheticeidos@gmail.com" },
]
keywords = ["ascii-art", "glyphs", "image-processing", "terminal", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.0",
    "pillow>=9.0.0",
    "pyfiglet>=0.8.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
tui = ["textual>=8.2.8"]
media = [
    "mss>=9.0.1",
    "opencv-python>=4.8.0",
]
network = ["yt-dlp>=2025.1.15"]
virtual = ["PyVirtualDisplay>=3.0"]
control = ["pynput>=1.8.2"]
bundle = ["pyinstaller>=6.22.0,<7"]
all = [
    "mss>=9.0.1",
    "opencv-python>=4.8.0",
    "pynput>=1.8.2",
    "PyVirtualDisplay>=3.0",
    "textual>=8.2.8",
    "yt-dlp>=2025.1.15",
]
dev = [
    "build>=1.2.2",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.2",
    "twine>=6.0.0",
    "types-PyYAML>=6.0.12",
    "tomli>=2.2.1; python_version < '3.11'",
]

[project.scripts]
glyph-forge = "glyph_forge.cli:main"
glyphforge = "glyph_forge.cli:main"
glyph_forge = "glyph_forge.cli:main"
glyphfy = "glyph_forge.cli.glyphfy:main"
imagize = "glyph_forge.cli.imagize:main"
bannerize = "glyph_forge.cli.bannerize:main"

[project.urls]
Homepage = "https://github.com/Ace1928/glyph_forge"
Documentation = "https://glyph-forge.readthedocs.io/"
Issues = "https://github.com/Ace1928/glyph_forge/issues"
Source = "https://github.com/Ace1928/glyph_forge"

[tool.setuptools.packages.find]
where = ["src"]
include = ["glyph_forge*"]

[tool.setuptools.package-data]
glyph_forge = [
    "py.typed",
    "config/*.json",
    "resources/*",
    "ui/*.css",
    "ui/web/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--color=yes"]
markers = [
    "unit: isolated unit tests",
    "integration: multi-component integration tests",
    "e2e: end-to-end tests",
    "slow: tests excluded from quick local runs",
    "critical: core behavior checks",
]

[tool.coverage.run]
branch = true
source = ["glyph_forge"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/glyph_forge/cli/*.py" = ["B008"]
"tests/test_tui.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["cv2", "mss"]
ignore_missing_imports = true
