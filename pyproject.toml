[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "glyph-forge"
version = "1.0.0"
description = "Adaptive high-performance image, video, and stream rendering for terminals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lloyd Handyside", email = "ace1928@gmail.com" },
    { name = "Eidos", email = "syntheticeidos@gmail.com" },
]
keywords = [
    "ansi",
    "ascii-art",
    "image-processing",
    "terminal",
    "video",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<2.5",
    "pillow>=10.4,<13",
    "pyfiglet>=1,<2",
    "rich>=13.9,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
streaming = [
    "mss>=9,<11",
    "opencv-python-headless>=4.10,<5",
    "yt-dlp>=2026.2.21,<2027",
]
browser = ["playwright>=1.50,<2"]
tui = ["textual>=0.80,<7"]
audio = [
    "pygame>=2.5,<3",
    "simpleaudio>=1.0.4,<2",
]
clipboard = ["pyperclip>=1.9,<2"]
full = [
    "mss>=9,<11",
    "opencv-python-headless>=4.10,<5",
    "playwright>=1.50,<2",
    "pygame>=2.5,<3",
    "pyperclip>=1.9,<2",
    "simpleaudio>=1.0.4,<2",
    "textual>=0.80,<7",
    "yt-dlp>=2026.2.21,<2027",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<3",
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-benchmark>=5,<6",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]

[project.urls]
Documentation = "https://github.com/Ace1928/glyph_forge/tree/master/docs"
Homepage = "https://github.com/Ace1928/glyph_forge"
Issues = "https://github.com/Ace1928/glyph_forge/issues"
Repository = "https://github.com/Ace1928/glyph_forge.git"

[project.scripts]
glyph-forge = "glyph_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph_forge"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/DEMO.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/completions",
    "/docs",
    "/examples",
    "/scripts/benchmark.py",
    "/src",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B019", # Legacy instance caches are isolated while their replacements are benchmarked.
    "B904", # Existing optional-dependency translations are migrating to explicit causes.
    "E501", # The formatter is authoritative for long CLI help and fixture lines.
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"src/glyph_forge/cli/*.py" = ["B008"]
"tests/*.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "integration: exercises more than one Glyph Forge subsystem",
]

[tool.coverage.run]
branch = true
source = ["glyph_forge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "mss.*",
    "playwright.*",
    "pygame.*",
    "pyfiglet.*",
    "pyperclip.*",
    "simpleaudio.*",
    "textual.*",
    "yt_dlp.*",
]
ignore_missing_imports = true
