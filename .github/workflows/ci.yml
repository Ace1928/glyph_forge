name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyph-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check stable rendering surfaces
        run: >-
          python -m mypy --follow-imports=skip
          src/glyph_forge/_version.py
          src/glyph_forge/__init__.py
          src/glyph_forge/exceptions.py
          src/glyph_forge/terminal.py
          src/glyph_forge/services/image_to_glyph.py
          src/glyph_forge/streaming/naming.py
          src/glyph_forge/streaming/core/buffer.py
          src/glyph_forge/streaming/core/config.py
          src/glyph_forge/streaming/core/renderer.py

  test:
    name: Core tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q --tb=short

  optional:
    name: Streaming and TUI tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional feature stacks
        run: python -m pip install -e ".[dev,streaming,tui]"
      - name: Run complete optional suite
        run: python -m pytest -q --tb=short

  package:
    name: Build and inspect distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: glyph-forge-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  wheel-smoke:
    name: Wheel smoke test (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: glyph-forge-distributions
          path: dist
      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Exercise installed CLI and renderer
        shell: bash
        run: |
          glyph-forge version
          glyph-forge --help
          python -m glyph_forge --help
          python -c "from PIL import Image; from glyph_forge import image_to_glyph; result=image_to_glyph(Image.new('L',(8,8),128), width=8, auto_scale=False); assert result.strip(); print(result)"

  dependency-audit:
    name: Audit core dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and auditor
        run: python -m pip install . pip-audit
      - name: Scan installed dependency graph
        run: python -m pip_audit
