name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade --editable ".[dev,tui]"
      - name: Check formatting
        run: python -m ruff format --check src tests examples
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Type check
        run: python -m mypy src/glyph_forge

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
            coverage: true
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Glyph Forge
        run: python -m pip install --upgrade --editable ".[dev,tui]"
      - name: Run tests
        if: matrix.coverage != true
        run: python -m pytest -q
      - name: Run tests with branch coverage
        if: matrix.coverage == true
        run: python -m pytest -q --cov=glyph_forge --cov-report=term --cov-report=xml

  optional:
    name: Optional feature installation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install every feature extra
        run: python -m pip install --upgrade --editable ".[all]"
      - name: Verify optional imports and runtime report
        run: |
          python -c "import cv2, mss, pyvirtualdisplay, textual, yt_dlp"
          glyph-forge doctor --json

  package:
    name: Package
    needs: [test, optional]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel and packaged resources
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from importlib.resources import files; import glyph_forge; assert files('glyph_forge').joinpath('resources/eidos_profile.yml').is_file(); assert files('glyph_forge').joinpath('ui/web/index.html').is_file()"
          glyph-forge version
          glyph-forge demo --width 24 --mode braille
      - uses: actions/upload-artifact@v7
        with:
          name: glyph-forge-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
