name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade --editable ".[dev,tui]"
      - name: Check formatting
        run: python -m ruff format --check src tests examples tools
      - name: Lint
        run: python -m ruff check src tests examples tools
      - name: Enforce maintained boundary complexity
        run: >-
          python -m ruff check --select C901
          --config "lint.mccabe.max-complexity=10"
          src/glyph_forge/contracts.py
          src/glyph_forge/temporal.py
          src/glyph_forge/rendering.py
          src/glyph_forge/persistence.py
          src/glyph_forge/config/settings.py
          src/glyph_forge/api/glyph_api.py
          src/glyph_forge/cli/image.py
      - name: Type check
        run: python -m mypy src/glyph_forge

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
            coverage: true
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Glyph Forge
        run: python -m pip install --upgrade --editable ".[dev,tui]"
      - name: Run tests
        if: matrix.coverage != true
        run: python -m pytest -q
      - name: Run tests with branch coverage
        if: matrix.coverage == true
        run: python -m pytest -q --cov=glyph_forge --cov-report=term --cov-report=xml

  optional:
    name: Optional feature installation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install every feature extra
        run: python -m pip install --upgrade --editable ".[all]"
      - name: Verify optional imports and runtime report
        run: |
          python -c "import cv2, mss, pyvirtualdisplay, textual, yt_dlp"
          glyph-forge doctor --json

  web:
    name: Browser Studio (Chromium, Firefox, WebKit, touch)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked web test tools
        run: npm ci
      - name: Install current browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run desktop, mobile, accessibility, offline, and performance gates
        run: npm run test:web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-studio-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: Portable Linux bundle smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install portable bundle tools
        run: python -m pip install --upgrade --editable ".[bundle,tui]"
      - name: Build one-directory application
        env:
          GLYPH_FORGE_BUNDLE_CORE: "1"
        run: >-
          python -m PyInstaller --noconfirm --clean
          --distpath bundle-dist --workpath bundle-build
          tools/glyph-forge.spec
      - name: Exercise frozen command, renderer, and Studio
        run: python -m tools.release_assets smoke --bundle bundle-dist/glyph-forge

  package:
    name: Package
    needs: [test, optional, web, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel and packaged resources
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from importlib.metadata import version; import glyph_forge; assert version('glyphforge') == glyph_forge.__version__"
          python -c "from importlib.resources import files; import glyph_forge; from glyph_forge import SharePublication; from glyph_forge.plugins import PLUGIN_API_VERSION, PluginManifest, PluginRegistry; root = files('glyph_forge'); assert root.joinpath('resources/eidos_profile.yml').is_file(); assert root.joinpath('ui/web/index.html').is_file(); assert root.joinpath('ui/web/studio-renderers.js').is_file(); assert root.joinpath('ui/web/manifest.webmanifest').is_file(); assert root.joinpath('ui/web/service-worker.js').is_file(); assert root.joinpath('ui/web/icon-512.png').is_file(); assert root.joinpath('sharing.py').is_file(); assert root.joinpath('plugins/contracts.py').is_file(); assert not root.joinpath('services/image_to_Glyph.py').is_file(); assert SharePublication.__module__ == 'glyph_forge.studio'; assert PLUGIN_API_VERSION == 1; assert PluginManifest(name='CI', version='1').name == 'CI'; assert PluginRegistry(discoverer=lambda: ()).inventory() == ()"
          python -c "from io import BytesIO; from PIL import Image; from glyph_forge import RENDER_CONTRACT_VERSION, RenderRequest, render_image; artifact = render_image(Image.new('RGB', (8, 6), '#789abc'), RenderRequest(width=4, height=3, output_format='png', output_width=33, output_height=21)); assert RENDER_CONTRACT_VERSION == 1; assert (artifact.columns, artifact.rows) == (4, 3); assert (artifact.pixel_width, artifact.pixel_height) == (33, 21); assert Image.open(BytesIO(artifact.data)).size == (33, 21)"
          glyph-forge version
          glyph-forge share --help
          glyph-forge plugins --json
          glyph-forge demo --width 24 --mode braille
      - uses: actions/upload-artifact@v7
        with:
          name: glyph-forge-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
