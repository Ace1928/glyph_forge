version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(python)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(web)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps(actions)
