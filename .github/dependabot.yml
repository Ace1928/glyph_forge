version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Australia/Brisbane
    # Routine upgrades are maintained directly on main. Security updates remain
    # enabled in the repository settings without creating version-update branches.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 0
