      <stop stop-color="#10261f"/>
      <stop offset=".58" stop-color="#07110f"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>
    <radialGradient id="glow" cx=".77" cy=".08" r=".72">
      <stop stop-color="#5fffc1" stop-opacity=".24"/>
      <stop offset="1" stop-color="#5fffc1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#5fffc1" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#surface)"/>
